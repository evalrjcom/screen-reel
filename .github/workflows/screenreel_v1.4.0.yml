# screenreel_v1.4.0.yml — CI for ScreenReel v1.4.0
# Produces: fully static musl Linux ELF, static-CRT Windows .exe, portable glibc build,
# and runs the headless --selftest (capture -> edit -> MKV export -> ffmpeg decode),
# plus a system-audio (loopback) capture test against a private PulseAudio null sink.
name: screenreel_v1.4.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:

permissions:
  contents: write   # needed only to attach release assets on tag pushes

jobs:
  linux-static:
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - run: apk add --no-cache git bash
      - uses: actions/checkout@v4
      - name: Build fully static musl binary
        run: |
          mkdir -p /src && cp -a . /src && cd /src
          ./build_screenreel_v1.4.0.sh linux-static
          mkdir -p "$GITHUB_WORKSPACE/dist" && cp dist/* "$GITHUB_WORKSPACE/dist/"
      - uses: actions/upload-artifact@v4
        with: { name: screenreel_v1.4.0-linux-x86_64-static, path: dist/screenreel_v1.4.0-linux-x86_64-static }

  linux-glibc-and-selftest:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config autoconf automake libtool \
            libx11-dev libxext-dev libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev libxft-dev \
            libfontconfig1-dev xvfb ffmpeg pulseaudio pulseaudio-utils
      - uses: dtolnay/rust-toolchain@stable
      - name: Build portable glibc binary
        run: ./build_screenreel_v1.4.0.sh native
      - name: Headless self-test
        run: ./build_screenreel_v1.4.0.sh selftest dist/screenreel_v1.4.0-linux-x86_64-glibc
      - uses: actions/upload-artifact@v4
        with: { name: screenreel_v1.4.0-linux-x86_64-glibc, path: dist/screenreel_v1.4.0-linux-x86_64-glibc }

  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"   # static MSVC CRT => no VC++ redistributable needed
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Smoke test
        shell: bash
        run: |
          ./target/release/screenreel.exe --version
          mkdir -p dist && cp target/release/screenreel.exe dist/screenreel_v1.4.0-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with: { name: screenreel_v1.4.0-windows-x86_64, path: dist/screenreel_v1.4.0-windows-x86_64.exe }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-static, linux-glibc-and-selftest, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          name: ScreenReel v1.4.0
          files: out/*
